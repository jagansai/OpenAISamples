<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat UI</title>
  <style>
    :root{font-family:Segoe UI,Roboto,Arial,Helvetica,sans-serif}
    body{margin:0;display:flex;flex-direction:column;height:100vh}
    header{padding:12px 16px;background:#24292f;color:#fff;font-weight:600}
    #chatContainer{flex:1;display:flex;flex-direction:column;padding:12px;gap:8px;background:#f6f8fa}
    #messages{flex:1;overflow-y:auto;padding:12px;border:1px solid #ddd;border-radius:6px;background:#fff}
    .msg{margin-bottom:10px}
    .msg .who{font-weight:600;margin-bottom:4px}
    .msg .text{white-space:pre-wrap}
    .user{background:#e6f0ff;padding:8px;border-radius:6px}
    .bot{background:#f1f3f5;padding:8px;border-radius:6px}

    #composer{display:flex;gap:8px;padding:12px;border-top:1px solid #e5e7eb;background:#fff}
    #prompt{flex:1;min-height:40px;padding:8px;border:1px solid #ccc;border-radius:6px;resize:none}
    #send{padding:8px 14px;border:0;background:#0366d6;color:#fff;border-radius:6px;cursor:pointer}
    #send:disabled{opacity:0.6;cursor:default}
    .small{font-size:12px;color:#666}
  </style>
</head>
<body>
  <header>Simple Chat UI</header>
  <div id="chatContainer">
    <div id="messages" aria-live="polite" aria-atomic="false"></div>

    <div id="composer">
      <textarea id="prompt" placeholder="Type your message and press Enter or click Send" rows="2"></textarea>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
          <div style="display:flex;gap:8px;align-items:center">
            <input type="file" id="fileInput" />
            <button id="uploadBtn">Upload log</button>
            <button id="send">Send</button>
          </div>
          <div class="small" id="apiHint">API: POST /api/chat • POST /api/upload-log (multipart file field: file)</div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      const messagesEl = document.getElementById('messages');
      const promptEl = document.getElementById('prompt');
      const sendBtn = document.getElementById('send');

      function appendMessage(who, text) {
        const wrapper = document.createElement('div');
        wrapper.className = 'msg';
        const whoEl = document.createElement('div');
        whoEl.className = 'who';
        whoEl.textContent = who;
        const textEl = document.createElement('div');
        textEl.className = 'text ' + (who === 'You' ? 'user' : 'bot');
        textEl.textContent = text;
        wrapper.appendChild(whoEl);
        wrapper.appendChild(textEl);
        messagesEl.appendChild(wrapper);
        // Keep scrollbar at bottom
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      const apiUrlBase = '';

      async function send() {
        const value = promptEl.value.trim();
        if (!value) return;
        sendBtn.disabled = true;
        appendMessage('You', value);
        promptEl.value = '';

        try {
          const apiPath = '/api/chat';
          document.getElementById('apiHint').textContent = 'API: POST /api/chat';

          const resp = await fetch(apiUrlBase + apiPath, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: value })
          });

          if (!resp.ok) {
            const text = await resp.text();
            appendMessage('Error', `HTTP ${resp.status}: ${text}`);
            return;
          }
          const json = await resp.json();
          const html = json && json.html ? json.html : (json && json.markdown ? json.markdown : JSON.stringify(json));
          appendHtmlMessage('Bot', html);
        }
        catch (err) {
          appendMessage('Error', err.message || String(err));
        }
        finally {
          sendBtn.disabled = false;
          promptEl.focus();
        }
      }
      async function uploadLog() {
        const input = document.getElementById('fileInput');
        if (!input.files || input.files.length === 0) {
          appendMessage('Error', 'No file selected');
          return;
        }
        const file = input.files[0];
        const fd = new FormData();
        fd.append('file', file, file.name);
        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.disabled = true;
        try {
          const resp = await fetch('/api/upload-log', { method: 'POST', body: fd });
          const text = await resp.text();
          if (!resp.ok) {
            appendMessage('Error', `Upload failed: ${resp.status} ${text}`);
            console.log(`Upload failed: ${resp.status} ${text}`);
          } else {
            appendMessage('Bot', `Upload success: ${text}`);
            console.log(`Upload success: ${text}`);
          }
        } catch (err) {
          appendMessage('Error', err.message || String(err));
          console.log(err);
        } finally {
          uploadBtn.disabled = false;
        }
      }
      function appendHtmlMessage(who, html) {
        const wrapper = document.createElement('div');
        wrapper.className = 'msg';
        const whoEl = document.createElement('div');
        whoEl.className = 'who';
        whoEl.textContent = who;
        const textEl = document.createElement('div');
        textEl.className = 'text bot';
        textEl.innerHTML = html;
        wrapper.appendChild(whoEl);
        wrapper.appendChild(textEl);
        messagesEl.appendChild(wrapper);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      sendBtn.addEventListener('click', send);
    document.getElementById('uploadBtn').addEventListener('click', uploadLog);
      promptEl.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });

      // initial focus
      promptEl.focus();

      // small helper to show sample
      appendMessage('Bot', 'Welcome — type a prompt below and press Send.');
    })();
  </script>
</body>
</html>
